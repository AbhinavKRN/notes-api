{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notes-api
spec:
  selector:
    matchLabels:
      app: notes-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notes-api
spec:
  groups:
    - name: notes-api
      rules:
        - alert: NotesApiDown
          expr: sum(up{job="notes-api"}) == 0 or absent(up{job="notes-api"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No notes-api pod is being scraped
        - alert: NotesApiHighErrorRate
          expr: sum(rate(http_requests_total{job="notes-api",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="notes-api"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: More than 5% of requests are failing
        - alert: NotesApiSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="notes-api"}[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: p95 latency is above 500ms
{{- end }}
